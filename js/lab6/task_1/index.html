<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Управління товарами</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="header">
      <h1>Каталог товарів</h1>
      <div id="total-price-container" class="total-price">
        Загальна вартість: <span id="total-price">0</span> ₴
      </div>
    </header>

    <div class="container">
      <aside class="sidebar">
        <div class="controls-group">
          <h3>Фільтрація (Категорії)</h3>
          <button class="filter-btn" data-category="Електроніка">
            Електроніка
          </button>
          <button class="filter-btn" data-category="Одяг">Одяг</button>
          <button class="filter-btn" data-category="Книги">Книги</button>
          <button class="reset-btn" id="reset-filter">Скинути фільтр</button>
        </div>

        <div class="controls-group">
          <h3>Сортування</h3>
          <button class="sort-btn" data-sort="price">За ціною</button>
          <button class="sort-btn" data-sort="created">
            За датою створення
          </button>
          <button class="sort-btn" data-sort="updated">
            За датою оновлення
          </button>
          <button class="reset-btn" id="reset-sort">Скинути сортування</button>
        </div>
      </aside>

      <main class="main-content">
        <h2 id="empty-message" class="empty-message">
          Наразі список товарів пустий. Додайте новий товар.
        </h2>

        <ul id="product-list" class="product-grid"></ul>

        <button id="btn-add-product" class="btn-primary">
          Додати новий товар
        </button>
      </main>
    </div>

    <div id="product-modal" class="modal">
      <div class="modal-content">
        <span class="close-modal">&times;</span>
        <h2 id="modal-title">Додати товар</h2>
        <form id="product-form">
          <input type="hidden" id="product-id" />

          <div class="form-group">
            <label for="product-name">Назва товару:</label>
            <input type="text" id="product-name" required minlength="2" />
          </div>

          <div class="form-group">
            <label for="product-price">Ціна (₴):</label>
            <input
              type="number"
              id="product-price"
              required
              min="0.01"
              step="0.01"
            />
          </div>

          <div class="form-group">
            <label for="product-category">Категорія:</label>
            <select id="product-category" required>
              <option value="" disabled selected>Оберіть категорію</option>
              <option value="Електроніка">Електроніка</option>
              <option value="Одяг">Одяг</option>
              <option value="Книги">Книги</option>
            </select>
          </div>

          <div class="form-group">
            <label for="product-image">URL Зображення:</label>
            <input
              type="url"
              id="product-image"
              required
              placeholder="https://..."
            />
          </div>

          <button type="submit" class="btn-success">Зберегти товар</button>
        </form>
      </div>
    </div>

    <div id="snackbar"></div>

    <script src="script.js"></script>
  </body>
</html>
