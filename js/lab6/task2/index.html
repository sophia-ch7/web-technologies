<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Лабораторна робота - Список завдань</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="todo-container">
      <header class="todo-header">
        <h1>Мій To-Do List</h1>
      </header>

      <form id="add-task-form" class="task-form">
        <input
          type="text"
          id="task-input"
          placeholder="Що потрібно зробити?"
          required
          minlength="2"
          autocomplete="off"
        />
        <button type="submit" class="btn-add">Додати</button>
      </form>

      <section class="sort-panel" id="sort-controls">
        <span>Сортувати:</span>
        <button data-sort="createdAt" class="active">За датою (нові)</button>
        <button data-sort="status">За станом (активні)</button>
        <button data-sort="updatedAt">За оновленням</button>
      </section>

      <ul id="task-list" class="task-list"></ul>
    </main>

    <script src="script.js"></script>
  </body>
</html>
