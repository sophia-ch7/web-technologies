<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Мови Програмування</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="app-header">
      <button id="edit-btn" class="edit-btn">Редагувати</button>
    </header>

    <main class="container">
      <div class="grid" id="sortable-grid">
        <div class="card" data-lang="js">
          <button class="delete-btn">×</button>
          <div class="icon" style="background: #f7df1e; color: black">JS</div>
          <span>JavaScript</span>
        </div>
        <div class="card" data-lang="py">
          <button class="delete-btn">×</button>
          <div class="icon" style="background: #3776ab">Py</div>
          <span>Python</span>
        </div>
        <div class="card" data-lang="cpp">
          <button class="delete-btn">×</button>
          <div class="icon" style="background: #00599c">C++</div>
          <span>C++</span>
        </div>
        <div class="card" data-lang="java">
          <button class="delete-btn">×</button>
          <div class="icon" style="background: #b07219">Ja</div>
          <span>Java</span>
        </div>
        <div class="card" data-lang="ts">
          <button class="delete-btn">×</button>
          <div class="icon" style="background: #3178c6">TS</div>
          <span>TypeScript</span>
        </div>
        <div class="card" data-lang="php">
          <button class="delete-btn">×</button>
          <div class="icon" style="background: #777bb4">PHP</div>
          <span>PHP</span>
        </div>
        <div class="card" data-lang="cs">
          <button class="delete-btn">×</button>
          <div class="icon" style="background: #178600">C#</div>
          <span>C#</span>
        </div>
        <div class="card" data-lang="go">
          <button class="delete-btn">×</button>
          <div class="icon" style="background: #00add8">Go</div>
          <span>GoLang</span>
        </div>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
