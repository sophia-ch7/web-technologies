<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memory Pair Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-container">
      <aside class="settings-panel">
        <h2>Налаштування</h2>

        <div class="input-group">
          <label for="players-mode">Кількість гравців:</label>
          <select id="players-mode">
            <option value="1">1 Гравець</option>
            <option value="2">2 Гравці</option>
          </select>
        </div>

        <div class="input-group">
          <label for="player1-name">Ім'я (Гравець 1):</label>
          <input type="text" id="player1-name" value="Гравець 1" />
        </div>

        <div class="input-group" id="player2-group">
          <label for="player2-name">Ім'я (Гравець 2):</label>
          <input type="text" id="player2-name" value="Гравець 2" />
        </div>

        <div class="input-group">
          <label for="grid-size">Розмір поля (мінімум 4x4):</label>
          <select id="grid-size">
            <option value="16" selected>4 x 4 (16 карток)</option>
            <option value="20">5 x 4 (20 карток)</option>
            <option value="24">6 x 4 (24 картки)</option>
          </select>
        </div>

        <div class="input-group">
          <label for="difficulty">Складність:</label>
          <select id="difficulty">
            <option value="easy" selected>Easy (3 хв)</option>
            <option value="normal">Normal (2 хв)</option>
            <option value="hard">Hard (1 хв)</option>
          </select>
        </div>

        <div class="input-group">
          <label for="rounds">Кількість раундів:</label>
          <input type="number" id="rounds" min="1" value="1" />
        </div>

        <div class="button-group">
          <button id="reset-settings-btn" class="btn btn-secondary">
            Скинути налаштування
          </button>
          <button id="start-game-btn" class="btn btn-primary">
            Розпочати гру
          </button>
        </div>
      </aside>

      <main class="game-area">
        <header class="game-header">
          <div class="stat-box">
            <span class="label">Раунд</span>
            <div class="value">
              <span id="current-round">1</span>/<span id="total-rounds">1</span>
            </div>
          </div>
          <div class="stat-box">
            <span class="label">Хід гравця</span>
            <div class="value" id="active-player-name">-</div>
          </div>
          <div class="stat-box">
            <span class="label">Пари</span>
            <div class="value" id="pairs-count">0</div>
          </div>
          <div class="stat-box">
            <span class="label">Ходи</span>
            <div class="value" id="moves-count">0</div>
          </div>
          <div class="stat-box timer-box">
            <span class="label">Час</span>
            <div class="value" id="time-remaining">00:00</div>
          </div>
          <button id="restart-btn" class="btn btn-secondary btn-small">
            Рестарт
          </button>
        </header>

        <div class="game-board" id="board" data-round="0"></div>
      </main>
    </div>

    <div id="stats-modal" class="modal hidden">
      <div class="modal-content">
        <h2 id="winner-title">Гру завершено! 🌸</h2>
        <div id="round-stats-container"></div>
        <button id="close-modal-btn" class="btn btn-primary">Нова гра</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
